# Builds Video Converter for Windows, Linux and macOS (Apple Silicon and Intel),
# and publishes a GitHub release when a v* tag is pushed.
#
#   git tag v2.1.0 && git push origin v2.1.0
#
# Run it by hand from the Actions tab (workflow_dispatch) to build all four
# packages as downloadable artifacts without publishing anything.
#
# The tag must match the project() VERSION in CMakeLists.txt, and CHANGELOG.md
# must have a "## [x.y.z]" section for it -- the release notes come from there.

name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest, preset: windows-x64, triplet: x64-windows-static }
          # The oldest supported LTS on purpose: the binary requires the glibc it
          # was built against (2.35 here), so it also runs on Ubuntu 22.04+,
          # Debian 12+ and their derivatives. GCC 12 is installed below because
          # 22.04's default GCC 11 is thin on C++20.
          - { platform: linux-x64,   os: ubuntu-22.04,   preset: linux-x64,   triplet: x64-linux }
          - { platform: macos-arm64, os: macos-latest,   preset: macos-arm64, triplet: arm64-osx }
          # GitHub's last Intel macOS image, supported until August 2027.
          - { platform: macos-x64,   os: macos-15-intel, preset: macos-x64,   triplet: x64-osx }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/^  VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          [ -n "$v" ] || { echo "::error::could not read the version from CMakeLists.txt"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt version $v"
            exit 1
          fi
          echo "Building $v"

      # Visual Studio's x64 developer environment (cl, link, the Windows SDK)
      # for every later step: vswhere finds the installation, vcvars64.bat sets
      # it up, and whatever it added or changed goes to GITHUB_ENV. Done here
      # rather than with ilammy/msvc-dev-cmd, which still targets the retired
      # Node.js 20 Actions runtime.
      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the C++ x64 tools was not found' }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          # A tiny batch file avoids cmd.exe's quoting rules for the path.
          $cmd = Join-Path $env:RUNNER_TEMP 'vcvars-env.cmd'
          Set-Content -Path $cmd -Encoding ascii -Value "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul", '@set'
          $lines = & cmd.exe /d /c $cmd
          if (-not ($lines -match '^VCToolsInstallDir=')) { throw 'vcvars64.bat did not set up the compiler environment' }
          $exported = 0
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              $exported++
            }
          }
          Write-Host "MSVC environment from $vs ($exported variables)"

      - name: Build tools
        run: |
          case "$RUNNER_OS" in
            Windows) choco install -y --no-progress ninja nsis ;;
            Linux)
              sudo apt-get update -qq
              sudo apt-get install -y -qq ninja-build libx11-dev gcc-12 g++-12
              # vcpkg and CMake both honour CC/CXX on Linux.
              echo "CC=gcc-12"  >> "$GITHUB_ENV"
              echo "CXX=g++-12" >> "$GITHUB_ENV"
              ;;
            macOS)   brew install ninja ;;
          esac

      - name: Cache CEF and vcpkg packages
        uses: actions/cache@v6
        with:
          path: |
            third_party/cef
            ${{ runner.temp }}/vcpkg-cache
          key: deps-${{ matrix.platform }}-${{ hashFiles('cmake/DownloadCEF.cmake') }}-v1

      - name: vcpkg
        run: |
          VCPKG="$RUNNER_TEMP/vcpkg"
          git clone -q --depth 1 https://github.com/microsoft/vcpkg "$VCPKG"
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c "$(cygpath -w "$VCPKG/bootstrap-vcpkg.bat")" -disableMetrics
          else
            "$VCPKG/bootstrap-vcpkg.sh" -disableMetrics
          fi
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          # Written after the MSVC step on purpose: Visual Studio's environment
          # sets VCPKG_ROOT to the vcpkg bundled with VS, which is manifest-only.
          echo "VCPKG_ROOT=$VCPKG" >> "$GITHUB_ENV"
          export VCPKG_DEFAULT_BINARY_CACHE="$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$VCPKG_DEFAULT_BINARY_CACHE" >> "$GITHUB_ENV"
          "$VCPKG/vcpkg" install nlohmann-json spdlog fmt --triplet ${{ matrix.triplet }}

      # Through bash explicitly: Git on Windows does not record the executable
      # bit, so the script cannot be relied on to be directly runnable.
      - name: FFmpeg
        run: bash scripts/fetch-ffmpeg.sh ${{ matrix.platform }}

      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-release

      # The engine on its own, driven by the convctl harness: proves the
      # process layer, the bundled ffmpeg and the audio pairing actually work on
      # this OS, not merely that the code compiles -- and that several inputs
      # are planned, named and laid out as documented.
      - name: Engine tests
        run: |
          cmake -S . -B build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCONVERTER_ENGINE_ONLY=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build/tests
          cd build/tests/tools/convctl
          cp -R "$GITHUB_WORKSPACE/third_party/ffmpeg/." .
          ./convctl size | tail -4
          if [ "$RUNNER_OS" = Windows ]; then ./convctl quote | tail -1; fi
          mkdir -p t/in t/out
          ./ffmpeg -nostdin -y -v error \
            -f lavfi -i "testsrc2=size=640x360:rate=25" \
            -f lavfi -i "sine=frequency=330:sample_rate=48000" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -f lavfi -i "anullsrc=r=48000:cl=mono" \
            -filter_complex "[1:a]volume=0.2[L];[2:a]volume=0.16[R]" \
            -map 0:v -map "[L]" -map "[R]" -map 3:a \
            -t 6 -c:v libx264 -preset ultrafast -c:a pcm_s16le -shortest t/in/pair.mkv
          ./convctl probe t/in/pair.mkv | tee probe.txt
          grep -q "output audio streams: 1" probe.txt
          ./convctl run t/in --out t/out --size 1MB --fast --cpu | tr '\r' '\n' | grep "done:" | tee run.txt
          grep -q "1 converted" run.txt

          # expect <file> <ERE>: fail, naming the pattern, when no line matches.
          expect() { grep -Eq -- "$2" "$1" || { echo "::error::no line in $1 matches: $2"; exit 1; }; }

          # Several inputs at once: two folders with the same name, two files
          # that map to one output name, a loose file, a non-media file, a
          # missing path and a file given twice. `plan` needs no ffmpeg, and its
          # line shapes are fixed (cmd_plan in tools/convctl/main.cpp). Paths
          # are matched with [/\\] because Windows prints backslashes, and \r is
          # dropped because it ends every Windows line.
          mkdir -p t/m/day1/cam/sub t/m/day2/cam t/m/loose
          for ext in mkv mov; do
            ./ffmpeg -nostdin -y -v error \
              -f lavfi -i "testsrc2=size=160x120:rate=25" \
              -f lavfi -i "sine=frequency=440:sample_rate=48000" \
              -t 1 -c:v libx264 -preset ultrafast -c:a aac -shortest "t/m/day1/cam/a.$ext"
          done
          ./ffmpeg -nostdin -y -v error -f lavfi -i "sine=frequency=330:sample_rate=48000" \
            -t 1 t/m/day1/cam/sub/b.wav
          cp t/m/day1/cam/a.mkv t/m/day2/cam/a.mkv
          cp t/m/day1/cam/a.mkv t/m/loose/c.mkv
          echo notes  > t/m/day1/cam/notes.txt
          echo readme > t/m/loose/readme.txt
          inputs=(t/m/day1/cam t/m/day2/cam t/m/loose/c.mkv t/m/loose/readme.txt
                  t/m/nothere.mkv t/m/day1/cam/a.mkv)

          ./convctl plan "${inputs[@]}" --out t/mout | tr -d '\r' | tee plan.txt
          expect plan.txt '^plan: 5 media file\(s\)$'
          expect plan.txt 'cam[/\\]a\.mov -> .*[/\\]mout[/\\]cam[/\\]a \(2\)\.mp4 \[renamed\]$'
          expect plan.txt 'cam[/\\]sub[/\\]b\.wav -> .*[/\\]mout[/\\]cam[/\\]sub[/\\]b\.mp3$'
          expect plan.txt 'day2[/\\]cam[/\\]a\.mkv -> .*[/\\]mout[/\\]cam \(2\)[/\\]a\.mp4( \[renamed\])?$'
          expect plan.txt 'loose[/\\]c\.mkv -> .*[/\\]mout[/\\]c\.mp4$'
          grep -A1 -x 'missing: 1'   plan.txt | tail -1 | grep -Eq '[/\\]nothere\.mkv$'
          grep -A1 -x 'not media: 1' plan.txt | tail -1 | grep -Eq '[/\\]readme\.txt$'
          expect plan.txt '^duplicates: 1$'
          expect plan.txt '^ignored in folders: 1$'
          expect plan.txt '^excluded \(inside output folder\): 0$'

          # The same inputs for real: every planned output appears, nothing
          # else does, and the non-media files are neither copied nor touched.
          ./convctl run "${inputs[@]}" --out t/mout --level high --fast --cpu \
            | tr '\r' '\n' | grep "done:" | tee run-multi.txt
          grep -q "5 converted, 0 remuxed, 0 skipped, 0 failed" run-multi.txt
          while IFS= read -r out; do
            [ -f "$out" ] || { echo "::error::planned output missing: $out"; exit 1; }
          done < <(sed -n 's/^  .* -> \(.*\)$/\1/p' plan.txt | sed 's/ \[renamed\]$//')
          [ "$(find t/mout -type f | wc -l | tr -d ' ')" = 5 ]
          # One test per file: bash -e ignores a failure anywhere in an && list
          # but its last command.
          for f in t/m/loose/readme.txt t/m/day1/cam/notes.txt t/m/day1/cam/a.mov; do
            [ -f "$f" ] || { echo "::error::input $f was removed"; exit 1; }
          done

          # An output folder inside the input folder is never read from.
          mkdir -p t/x/in/out
          cp t/m/loose/c.mkv t/x/in/c.mkv
          cp t/m/loose/c.mkv t/x/in/out/c.mp4
          ./convctl plan t/x/in --out t/x/in/out | tr -d '\r' | tee plan-inside.txt
          expect plan-inside.txt '^plan: 1 media file\(s\)$'
          expect plan-inside.txt '^excluded \(inside output folder\): 1$'

          # Replace mode never deletes an unrelated file that has the output's
          # name, while a file replaced in place keeps its own name.
          mkdir -p t/r
          cp t/m/loose/c.mkv t/r/clip.avi
          cp t/m/loose/c.mkv t/r/clip.mp4
          cp t/m/loose/c.mkv t/r/own.mp4
          ./convctl plan t/r/clip.avi t/r/own.mp4 --replace | tr -d '\r' | tee plan-replace.txt
          expect plan-replace.txt 'clip\.avi -> .*[/\\]clip \(2\)\.mp4 \[renamed\]$'
          expect plan-replace.txt 'own\.mp4 -> .*[/\\]own\.mp4$'

      # The app must make no network contact of its own ("Offline" in
      # docs/DEVELOPMENT.md). The staged app runs for 30 s on a virtual display,
      # with a fresh profile and every one of its processes under strace; a
      # single IPv4 or IPv6 connect(), or a datagram sent to an IPv4 or IPv6
      # address, fails the build. The sends matter because mDNS and SSDP
      # (Cast/DIAL discovery) go out with sendto() on an unconnected socket and
      # never call connect(). AF_UNIX (X11, D-Bus, IPC) and AF_NETLINK are local
      # and expected. Discovery starts on demand, so this idle run is a floor;
      # the MediaRouter entries in app.cc remain the real guard against it.
      - name: Offline check
        if: runner.os == 'Linux'
        run: |
          # xvfb and strace for the test. The rest are the app's own runtime
          # libraries (the list in the README), normally on the image already.
          sudo apt-get install -y -qq xvfb strace libnss3 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2
          stage="$(realpath "build/${{ matrix.preset }}/app/Release")"
          trace="$RUNNER_TEMP/offline.strace"
          # user_data_dir() follows XDG_DATA_HOME: a fresh profile, because state
          # left by an earlier launch could hide a first-launch contact.
          export XDG_DATA_HOME="$RUNNER_TEMP/offline-profile"
          mkdir -p "$XDG_DATA_HOME"

          # timeout puts itself and everything under it (xvfb-run, Xvfb, strace,
          # every Chromium process) in one process group and signals the whole
          # group, escalating to SIGKILL 10 s later. Its status is 124 (137 after
          # SIGKILL) when the app was still running at the end, which is the
          # point: an app that exited or crashed early leaves a clean trace that
          # proves nothing.
          status=0
          (cd "$stage" && timeout -k 10 30 xvfb-run -a -s "-screen 0 1280x800x24" \
            strace -f -qq -e trace=connect,sendto,sendmsg,sendmmsg -o "$trace" ./converter) \
            > "$RUNNER_TEMP/offline.log" 2>&1 || status=$?
          # Anything still running the staged binary, whatever its process group.
          for p in /proc/[0-9]*; do
            if [ "$(readlink "$p/exe" 2>/dev/null)" = "$stage/converter" ]; then
              kill -KILL "${p#/proc/}" 2>/dev/null || true
            fi
          done

          if [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            tail -n 40 "$RUNNER_TEMP/offline.log" || true
            tail -n 40 "$XDG_DATA_HOME/VideoConverter/logs/cef.log" 2>/dev/null || true
            echo "::error::the app stopped before the 30 s were up (status $status)"
            exit 1
          fi
          # The X11 connection alone guarantees some; none means strace saw nothing.
          calls=$(grep -c 'connect(' "$trace" 2>/dev/null || true)
          echo "connect() calls traced: ${calls:-0}"
          [ "${calls:-0}" -gt 0 ] || { echo "::error::strace recorded no connect() at all"; exit 1; }
          # Only a destination or peer address: strace prints those as
          # {sa_family=AF_INET...} (msg_name= for sendmsg/sendmmsg). A bare
          # AF_INET would also match netlink requests it decodes (ifa_family=).
          if grep -E 'sa_family=AF_INET6?\b' "$trace"; then
            echo "::error::the app made network contact (listed above)"
            exit 1
          fi

      # Info.plist is written by string replacement (converter_write_plist in
      # app/CMakeLists.txt), so nothing in the build ever parses it. Finder's
      # "Open With" depends on the two keys checked below.
      - name: Check Info.plist
        if: runner.os == 'macOS'
        run: |
          app="build/${{ matrix.preset }}/app/Release/converter.app"
          plist="$app/Contents/Info.plist"
          plutil -lint "$plist" "$app"/Contents/Frameworks/*Helper*.app/Contents/Info.plist
          for key in CFBundleDocumentTypes UTImportedTypeDeclarations; do
            plutil -extract "$key" xml1 -o - "$plist" > /dev/null \
              || { echo "::error::$key is missing from $plist"; exit 1; }
          done

      - name: Package
        run: |
          v="${{ steps.ver.outputs.version }}"
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          stage="build/${{ matrix.preset }}/app/Release"

          case "${{ matrix.platform }}" in
            windows-x64)
              cd installer
              "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION="$v" \
                -DSOURCE_DIR="..\\build\\windows-x64\\app\\Release" converter.nsi
              mv "VideoConverter-$v-windows-x64-setup.exe" "$out/"
              cd ..
              name="VideoConverter-$v-windows-x64-portable"
              cp -R "$stage" "$RUNNER_TEMP/$name"
              (cd "$RUNNER_TEMP" && 7z a -tzip -mx=7 "$out/$name.zip" "$name" > /dev/null)
              ;;

            linux-x64)
              for f in ffmpeg/LICENSE.txt ffmpeg/FFMPEG-SOURCE-OFFER.txt; do
                [ -f "$stage/$f" ] || { echo "::error::$f missing from the package"; exit 1; }
              done
              name="VideoConverter-$v-linux-x64"
              cp -a "$stage" "$RUNNER_TEMP/$name"
              # CEF ships libcef.so with full debug info and symbol table: 1.4 GB,
              # 256 MB without them. The dynamic symbols the app links against
              # are kept. Local builds keep everything, for debugging.
              strip --strip-unneeded "$RUNNER_TEMP/$name/libcef.so"
              tar -C "$RUNNER_TEMP" -czf "$out/$name.tar.gz" "$name"
              ;;

            macos-*)
              src="$stage/converter.app"
              root="$RUNNER_TEMP/dmg"
              app="$root/Video Converter.app"
              mkdir -p "$root"
              ditto "$src" "$app"

              # Ad-hoc signature, applied inside-out. Apple Silicon will not run
              # unsigned code at all, and a bundle whose nested code is unsigned
              # is reported as "damaged". This is not notarisation -- see the
              # README for the one-time "Open Anyway" step users need.
              fw="$app/Contents/Frameworks/Chromium Embedded Framework.framework"
              find "$fw" -name "*.dylib" -exec codesign --force --sign - {} \;
              codesign --force --sign - "$fw"
              for h in "$app"/Contents/Frameworks/*Helper*.app; do
                codesign --force --sign - "$h"
              done
              codesign --force --sign - "$app/Contents/MacOS/ffmpeg" "$app/Contents/MacOS/ffprobe"
              codesign --force --sign - "$app"
              codesign --verify --deep --strict --verbose=2 "$app"

              ln -s /Applications "$root/Applications"
              # hdiutil on GitHub's macOS runners sometimes fails with "Resource
              # busy" while a background scanner still holds the source folder;
              # it is transient, so retry a few times before failing the build.
              dmg="$out/VideoConverter-$v-${{ matrix.platform }}.dmg"
              for attempt in 1 2 3 4 5; do
                if hdiutil create -volname "Video Converter" -srcfolder "$root" -ov -format UDZO "$dmg"; then
                  break
                fi
                rm -f "$dmg"
                if [ "$attempt" = 5 ]; then
                  echo "::error::hdiutil failed 5 times"
                  exit 1
                fi
                echo "hdiutil failed (attempt $attempt), retrying in 15 s"
                sleep 15
              done
              ;;
          esac
          ls -la "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release notes and checksums
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$v]"
            exit 1
          fi
          cat >> notes.md <<'EOF'

          ---

          **Which file do I need?**

          | Platform | Download |
          |---|---|
          | Windows 10/11 (installer, no admin rights needed) | `...-windows-x64-setup.exe` |
          | Windows, no install | `...-windows-x64-portable.zip` |
          | macOS, Apple Silicon (M1 and later) | `...-macos-arm64.dmg` |
          | macOS, Intel | `...-macos-x64.dmg` |
          | Linux x86-64 | `...-linux-x64.tar.gz` |

          The app is not code-signed by Apple or Microsoft, so Windows SmartScreen
          and macOS Gatekeeper warn on first launch. The README explains the
          one-time step to allow it. `SHA256SUMS.txt` lists every file's checksum.
          EOF
          sed -i 's/^          //' notes.md
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - uses: softprops/action-gh-release@v3
        with:
          name: Video Converter ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
